<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分子合成 · Molecule Builder</title>
<style>
  :root{
    --bg:#0a0e14; --panel:rgba(18,22,30,.92); --line:rgba(255,255,255,.10);
    --ink:#e8ecf4; --muted:#7f8a9e; --accent:#6ea8ff; --ok:#4ad991; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(120% 90% at 50% 0%,#172133 0%,#0d1219 48%,#080a0e 100%);
    color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:18px 16px 22px;gap:12px;
  }
  .top{width:min(96vw,980px);display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
  .lv{font-size:12px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  h1{margin:4px 0 0;font-size:clamp(19px,2.4vw,26px);font-weight:650;letter-spacing:.02em}
  .formula{font-family:"Cascadia Mono",Consolas,monospace;font-size:14px;color:#9dc0ff;
           letter-spacing:.06em}
  .meta{text-align:right;font-size:12.5px;color:var(--muted);line-height:1.7}
  .meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

  .board{
    width:min(96vw,980px);background:rgba(10,13,19,.72);border:1px solid var(--line);
    border-radius:16px;padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.5);position:relative;
  }
  svg{display:block;width:100%;height:auto;touch-action:manipulation}
  .atom circle{transition:fill .15s,stroke .15s}
  .atom{cursor:pointer}
  .atom text{user-select:none;pointer-events:none;font-weight:700}
  .atom.wrong circle{stroke:#ff6b6b!important;stroke-width:3}
  .atom.reveal circle{stroke:#4ad991!important;stroke-width:3}
  .atom.locked{opacity:.55}

  .bar{
    width:min(96vw,980px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    justify-content:center;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px
  }
  .el{
    display:flex;align-items:center;gap:7px;padding:7px 12px 7px 9px;border-radius:10px;
    border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.03);
    cursor:pointer;transition:.15s;font-family:inherit;color:#c6d2e4;font-size:13px
  }
  .el i{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;
        justify-content:center;font-size:11px;font-weight:800;font-style:normal;color:#07121e}
  .el em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
  .el:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06)}
  .el.on{border-color:var(--accent);background:rgba(110,168,255,.16);color:#dbe9ff}
  .el.empty{opacity:.3;pointer-events:none}
  .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
  .ctl{
    background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;
    padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s
  }
  .ctl:hover{color:var(--ink);border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.04)}
  .ctl.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:650}
  .ctl.primary:hover{filter:brightness(1.08)}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:rgba(20,26,36,.96);border:1px solid var(--line);border-radius:12px;
    padding:11px 20px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:30
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .win{
    position:fixed;inset:0;background:rgba(6,8,12,.9);z-index:40;display:none;
    align-items:center;justify-content:center;backdrop-filter:blur(6px)
  }
  .win.on{display:flex}
  .card{
    background:linear-gradient(180deg,#141a24,#0e131a);border:1px solid var(--line);
    border-radius:18px;padding:34px 40px;text-align:center;max-width:420px;
    box-shadow:0 30px 80px rgba(0,0,0,.6)
  }
  .card h2{margin:0 0 6px;font-size:24px}
  .card .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .card .big{font-size:30px;font-weight:700;color:var(--ok);margin:6px 0 4px}
  .card .stat{color:var(--muted);font-size:13px;line-height:1.9;margin-bottom:20px}
  .card button{
    background:var(--accent);border:0;color:#06121f;font-weight:650;font-size:14px;
    padding:12px 26px;border-radius:11px;cursor:pointer;font-family:inherit
  }
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="lv" id="lvLabel">第 1 关 / 8</div>
    <h1 id="title">？？？</h1>
    <div class="formula" id="formula"></div>
  </div>
  <div class="meta">
    已放置 <b id="placed">0</b> / <b id="total">0</b><br>
    用时 <b id="timer">0:00</b> · 提示 <b id="hintCount">0</b>
  </div>
</div>

<div class="board"><svg id="svg" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg"></svg></div>

<div class="bar">
  <div id="palette" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"></div>
  <div class="sep"></div>
  <button class="ctl primary" id="submit">提交</button>
  <button class="ctl" id="hint">提示</button>
  <button class="ctl" id="reset">重来</button>
  <button class="ctl" id="next">下一关</button>
</div>

<div class="toast" id="toast"></div>

<div class="win" id="win">
  <div class="card">
    <h2 id="winName"></h2>
    <div class="sub" id="winHint"></div>
    <div class="big">✓ 合成成功</div>
    <div class="stat" id="winStat"></div>
    <button id="winBtn">下一关</button>
  </div>
</div>

:"地西泮","formula":"C16H13ClN2O","hint":"含氯的七元环","atoms":[{"el":"Cl","x":0.0,"y":0.3714},{"el":"O","x":0.5666,"y":0.9438},{"el":"N","x":0.3887,"y":0.7902},{"el":"N","x":0.6191,"y":0.5771},{"el":"C","x":0.4053,"y":0.4906},{"el":"C","x":0.3296,"y":0.6378},{"el":"C","x":0.5942,"y":0.4315},{"el":"C","x":0.5985,"y":0.7187},{"el":"C","x":0.5231,"y":0.8329},{"el":"C","x":0.7449,"y":0.291},{"el":"C","x":0.2521,"y":0.4378},{"el":"C","x":0.1917,"y":0.6101},{"el":"C","x":0.3363,"y":0.8965},{"el":"C","x":0.1051,"y":0.4273},{"el":"C","x":0.0976,"y":0.535},{"el":"C","x":0.8115,"y":0.1584},{"el":"C","x":0.8824,"y":0.2352},{"el":"C","x":0.9001,"y":0.0635},{"el":"C","x":0.9844,"y":0.155},{"el":"C","x":1.0,"y":0.0562}],"bonds":[[0,13,1],[1,8,2],[2,5,1],[2,8,1],[2,12,1],[3,6,2],[3,7,1],[4,5,2],[4,6,1],[4,10,1],[5,11,1],[6,9,1],[7,8,1],[9,15,2],[9,16,1],[10,13,2],[11,14,2],[13,14,1],[15,17,1],[16,18,2],[17,19,2],[18,19,1]],"pool":{"Cl":1,"O":1,"N":2,"C":16}},{"name":"华法林","formula":"C19H16O4","hint":"香豆素骨架","atoms":[{"el":"O","x":0.787,"y":0.391},{"el":"O","x":0.6237,"y":0.2562},{"el":"O","x":0.7293,"y":0.5169},{"el":"O","x":0.3275,"y":0.8419},{"el":"C","x":0.4115,"y":0.5181},{"el":"C","x":0.5649,"y":0.4375},{"el":"C","x":0.3927,"y":0.6497},{"el":"C","x":0.2587,"y":0.4949},{"el":"C","x":0.6566,"y":0.3279},{"el":"C","x":0.7784,"y":0.2659},{"el":"C","x":0.6879,"y":0.4476},{"el":"C","x":0.3743,"y":0.772},{"el":"C","x":0.1497,"y":0.5166},{"el":"C","x":0.1605,"y":0.4436},{"el":"C","x":0.8575,"y":0.3108},{"el":"C","x":0.8584,"y":0.1864},{"el":"C","x":0.0522,"y":0.5107},{"el":"C","x":0.065,"y":0.4234},{"el":"C","x":0.9528,"y":0.2617},{"el":"C","x":0.3982,"y":0.8522},{"el":"C","x":0.0,"y":0.4589},{"el":"C","x":0.9433,"y":0.1478},{"el":"C","x":1.0,"y":0.1914}],"bonds":[[0,10,1],[0,14,1],[1,8,1],[2,10,2],[3,11,2],[4,5,1],[4,6,1],[4,7,1],[5,8,2],[5,10,1],[6,11,1],[7,12,2],[7,13,1],[8,9,1],[9,14,1],[9,15,2],[11,19,1],[12,16,1],[13,17,2],[14,18,2],[15,21,1],[16,20,2],[17,20,1],[18,22,1],[21,22,2]],"pool":{"O":4,"C":19}}];

const ELEM_COLOR = {
  C:'#7b8794', N:'#4f8ef7', O:'#ff6b6b', S:'#e8c547', Cl:'#5ddc7a',
  F:'#41d3c4', P:'#ff9f43', Br:'#c46a4a', I:'#a06bd6', H:'#dfe6f0'
};
const VALENCE = { C:4, N:3, O:2, S:2, Cl:1, F:1, P:3, Br:1, I:1, H:1 };

let li = 0;                 // 关卡索引
let assigned = [];          // 每个原子当前填的元素（'' 表示空）
let pool = {};              // 剩余可用元素
let locked = [];            // 提示锁定的原子
let selEl = null;
let hints = 0, startTime = 0, timerId = null;

const svg = document.getElementById('svg');
const palette = document.getElementById('palette');
const toastEl = document.getElementById('toast');
const NS = 'http://www.w3.org/2000/svg';

/* ------------------------------------------------------------- 关卡加载 */
function loadLevel(i) {
  li = i;
  const lv = LEVELS[i];
  assigned = new Array(lv.atoms.length).fill('');
  locked = new Array(lv.atoms.length).fill(false);
  pool = Object.assign({}, lv.pool);
  selEl = Object.keys(lv.pool)[0];
  hints = 0;
  startTime = Date.now();

  document.getElementById('lvLabel').textContent = '第 ' + (i + 1) + ' 关 / ' + LEVELS.length;
  document.getElementById('formula').textContent = '分子式 ' + lv.formula;
  // 名字先藏起来，解开才公布
  document.getElementById('title').textContent = '？？？';
  document.getElementById('win').classList.remove('on');

  renderSVG();
  renderPalette();
  updateMeta();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(updateMeta, 1000);
}

/* ---------------------------------------------------------------- 绘制 */
const PAD = 70;
let FIT = null;

function computeFit(lv) {
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  lv.atoms.forEach(a => {
    minx = Math.min(minx, a.x); maxx = Math.max(maxx, a.x);
    miny = Math.min(miny, a.y); maxy = Math.max(maxy, a.y);
  });
  const dx = (maxx - minx) || 1, dy = (maxy - miny) || 1;
  const W = 1000 - 2 * PAD, H = 620 - 2 * PAD;
  const s = Math.min(W / dx, H / dy);
  return { minx, miny, s, ox: PAD + (W - dx * s) / 2, oy: PAD + (H - dy * s) / 2 };
}

function pos(a) {
  return [FIT.ox + (a.x - FIT.minx) * FIT.s, FIT.oy + (a.y - FIT.miny) * FIT.s];
}

function renderSVG() {
  const lv = LEVELS[li];
  FIT = computeFit(lv);
  svg.innerHTML = '';

  // 键
  lv.bonds.forEach(([a, b, order]) => {
    const [x1, y1] = pos(lv.atoms[a]);
    const [x2, y2] = pos(lv.atoms[b]);
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const ox = -dy / len * 4.5, oy = dx / len * 4.5;

    if (order === 2) {
      for (const s of [-1, 1]) {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', x1 + ox * s); l.setAttribute('y1', y1 + oy * s);
        l.setAttribute('x2', x2 + ox * s); l.setAttribute('y2', y2 + oy * s);
        l.setAttribute('stroke', 'rgba(200,214,235,.55)');
        l.setAttribute('stroke-width', '2.6');
        svg.appendChild(l);
      }
    } else {
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1);
      l.setAttribute('x2', x2); l.setAttribute('y2', y2);
      l.setAttribute('stroke', 'rgba(200,214,235,.55)');
      l.setAttribute('stroke-width', '2.6');
      svg.appendChild(l);
    }
  });

  // 原子
  lv.atoms.forEach((a, i) => {
    const [x, y] = pos(a);
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'atom' + (locked[i] ? ' locked' : ''));
    g.dataset.i = i;

    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 19);
    c.setAttribute('fill', assigned[i] ? (ELEM_COLOR[assigned[i]] || '#888') : 'rgba(255,255,255,.04)');
    c.setAttribute('stroke', 'rgba(255,255,255,.22)');
    c.setAttribute('stroke-width', '1.6');
    g.appendChild(c);

    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y + 5);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '15');
    t.setAttribute('font-family', 'Segoe UI, sans-serif');
    if (assigned[i]) {
      t.setAttribute('fill', '#06121e');
      t.textContent = assigned[i];
    } else {
      t.setAttribute('fill', 'rgba(200,214,235,.35)');
      t.textContent = '?';
    }
    g.appendChild(t);

    g.addEventListener('click', () => assignAtom(i));
    g.addEventListener('contextmenu', e => { e.preventDefault(); clearAtom(i); });
    svg.appendChild(g);
  });
}

/* --------------------------------------------------------------- 交互 */
function assignAtom(i) {
  if (locked[i]) return;
  if (!selEl || !pool[selEl]) { toast('这个元素已经用完了'); return; }
  if (assigned[i]) pool[assigned[i]]++;
  assigned[i] = selEl;
  pool[selEl]--;
  if (!pool[selEl]) {
    const next = Object.keys(pool).find(k => pool[k] > 0);
    selEl = next || null;
  }
  renderSVG();
  renderPalette();
  updateMeta();
}

function clearAtom(i) {
  if (locked[i] || !assigned[i]) return;
  pool[assigned[i]]++;
  assigned[i] = '';
  if (!selEl) selEl = Object.keys(pool)[0];
  renderSVG();
  renderPalette();
  updateMeta();
}

function renderPalette() {
  const lv = LEVELS[li];
  palette.innerHTML = '';
  Object.keys(lv.pool).forEach(el => {
    const b = document.createElement('button');
    b.className = 'el' + (el === selEl ? ' on' : '') + (pool[el] === 0 ? ' empty' : '');
    b.innerHTML = '<i style="background:' + (ELEM_COLOR[el] || '#888') + '">' + el +
                  '</i><span>' + el + '</span><em>' + pool[el] + '</em>';
    b.onclick = () => { selEl = el; renderPalette(); };
    palette.appendChild(b);
  });
}

function updateMeta() {
  const lv = LEVELS[li];
  document.getElementById('placed').textContent = assigned.filter(Boolean).length;
  document.getElementById('total').textContent = lv.atoms.length;
  document.getElementById('hintCount').textContent = hints;
  const s = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById('timer').textContent =
    Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* --------------------------------------------------------------- 判定 */
function submit() {
  const lv = LEVELS[li];
  const empty = assigned.filter(a => !a).length;
  if (empty) { toast('还有 ' + empty + ' 个原子没填'); return; }

  const wrong = [];
  lv.atoms.forEach((a, i) => { if (assigned[i] !== a.el) wrong.push(i); });

  if (!wrong.length) { win(); return; }

  wrong.forEach(i => {
    const g = svg.querySelector('.atom[data-i="' + i + '"]');
    if (g) g.classList.add('wrong');
  });
  setTimeout(() => {
    svg.querySelectorAll('.wrong').forEach(g => g.classList.remove('wrong'));
  }, 1400);
  toast('有 ' + wrong.length + ' 个原子不对，再想想');
}

function hint() {
  const lv = LEVELS[li];
  const cand = lv.atoms.map((a, i) => i)
    .filter(i => !locked[i] && assigned[i] !== lv.atoms[i].el);
  if (!cand.length) { toast('已经全对了，直接提交'); return; }
  const pick = cand[Math.floor(Math.random() * cand.length)];
  if (assigned[pick]) pool[assigned[pick]]++;
  assigned[pick] = lv.atoms[pick].el;
  pool[lv.atoms[pick].el]--;
  locked[pick] = true;
  hints++;
  selEl = Object.keys(pool).find(k => pool[k] > 0) || null;
  renderSVG(); renderPalette(); updateMeta();
}

function win() {
  const lv = LEVELS[li];
  const secs = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById('title').textContent = lv.name;
  document.getElementById('winName').textContent = lv.name;
  document.getElementById('winHint').textContent = lv.hint;
  document.getElementById('winStat').innerHTML =
    '用时 ' + Math.floor(secs / 60) + ' 分 ' + (secs % 60) + ' 秒<br>' +
    '用了 ' + hints + ' 次提示';
  document.getElementById('win').classList.add('on');
  document.getElementById('winBtn').textContent =
    li + 1 < LEVELS.length ? '下一关' : '再玩一遍';
  if (timerId) clearInterval(timerId);
}

let toastT = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('on'), 1800);
}

/* --------------------------------------------------------------- 绑定 */
document.getElementById('submit').onclick = submit;
document.getElementById('hint').onclick = hint;
document.getElementById('reset').onclick = () => loadLevel(li);
document.getElementById('next').onclick = () => loadLevel((li + 1) % LEVELS.length);
document.getElementById('winBtn').onclick = () => loadLevel((li + 1) % LEVELS.length);

loadLevel(0);

/* --------------------------------------------------- 自检（#selftest） */
if (location.hash === '#selftest') {
  const res = [];
  const ok = (n, c) => res.push((c ? 'PASS ' : 'FAIL ') + n);

  loadLevel(2);                      // 阿司匹林
  const lv = LEVELS[2];
  const total = lv.atoms.length;

  // 按正确答案填满
  lv.atoms.forEach((a, i) => { selEl = a.el; assignAtom(i); });
  ok('fillAll', assigned.filter(Boolean).length === total);
  ok('poolDrain', Object.values(pool).every(v => v === 0));
  ok('allRight', lv.atoms.every((a, i) => assigned[i] === a.el));

  // 清除一个应归还计数
  clearAtom(0);
  ok('clearReturn', pool[lv.atoms[0].el] === 1 && assigned[0] === '');

  // 重新填回
  selEl = lv.atoms[0].el;
  assignAtom(0);
  ok('refill', lv.atoms.every((a, i) => assigned[i] === a.el));

  // 故意填错一个，submit 应报错而不是通关
  const wrongIdx = lv.atoms.findIndex(a => a.el === 'C');
  const other = Object.keys(lv.pool).find(k => k !== lv.atoms[wrongIdx].el);
  if (other) {
    clearAtom(wrongIdx);
    selEl = other;
    assignAtom(wrongIdx);
    submit();
    ok('wrongDetected', !document.getElementById('win').classList.contains('on'));
  }

  const pre = document.createElement('pre');
  pre.style.cssText = 'position:fixed;inset:0;background:#0a0e14;color:#e8ecf4;' +
    'font:600 22px/2 monospace;padding:40px;z-index:999;margin:0;white-space:pre-wrap';
  pre.textContent = res.join('\n');
  document.body.appendChild(pre);
}
</script>
